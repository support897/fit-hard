name: iOS native (SwiftUI) build

# Push to ios-native/** compiles the app for the simulator (no signing) to prove it builds.
# Run manually with ship=true to sign, archive and upload to TestFlight.
on:
  push:
    paths: ["ios-native/**", ".github/workflows/ios-native.yml"]
  workflow_dispatch:
    inputs:
      ship:
        description: "Upload to TestFlight"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle shared media from the web app
        run: |
          mkdir -p ios-native/FitHard/Resources/media
          cp app/assets/anim-*.webp app/assets/wally-*.webp ios-native/FitHard/Resources/media/
          ls ios-native/FitHard/Resources/media | wc -l

      - name: Install XcodeGen and generate the project
        working-directory: ios-native
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Compile for the simulator (no signing)
        working-directory: ios-native
        run: |
          set -o pipefail
          xcodebuild build -project FitHard.xcodeproj -scheme FitHard \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Print errors on failure
        if: failure()
        working-directory: ios-native
        run: grep -n "error:" build.log | head -60 || true

      - name: Unit tests (logic, allergies, reminders, persistence)
        working-directory: ios-native
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcodebuild test -project FitHard.xcodeproj -scheme FitHard -destination "id=$UDID" \
            -only-testing:FitHardTests CODE_SIGNING_ALLOWED=NO 2>&1 | tee unit.log | grep -E "Test Case|error:|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" unit.log

      - name: Unit test failures
        if: failure()
        working-directory: ios-native
        run: grep -nE "error:|failed" unit.log | head -60 || true

      - name: UI tests (onboarding, tabs, calendar, themes)
        working-directory: ios-native
        run: |
          set -o pipefail
          xcodebuild test -project FitHard.xcodeproj -scheme FitHard -destination "id=$UDID" \
            -only-testing:FitHardUITests -resultBundlePath "$RUNNER_TEMP/ui.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui.log | grep -E "Test Case|error:|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" ui.log

      - name: Collect screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/fh-shots
          if-no-files-found: warn

      - name: UI test failures
        if: failure()
        working-directory: ios-native
        run: grep -nE "error:|failed" ui.log | head -60 || true

      - name: Install signing material from secrets
        if: ${{ github.event.inputs.ship == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/distribution.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -d > "$CERT_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/4db7458a-51dc-4f2f-b761-653bfc71c604.mobileprovision"

      - name: Archive and export (single target, signing set on the command line)
        if: ${{ github.event.inputs.ship == 'true' }}
        working-directory: ios-native
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>GZ9Z6BPTFR</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key>
            <dict><key>com.ilseplacencia.fithard</key><string>Fit Hard App Store</string></dict>
          </dict>
          </plist>
          PLIST
          xcodebuild archive -project FitHard.xcodeproj -scheme FitHard -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/FitHard.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=GZ9Z6BPTFR \
            PROVISIONING_PROFILE_SPECIFIER="Fit Hard App Store" CODE_SIGN_IDENTITY="Apple Distribution"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FitHard.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        if: ${{ github.event.inputs.ship == 'true' }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$ASC_API_KEY_P8_B64" | base64 --decode -o "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          xcrun altool --upload-app -f "$(ls $RUNNER_TEMP/export/*.ipa | head -1)" -t ios --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
