name: iOS IPA (Fit Hard — PIPELINE PROOF, not for submission)

# Manual run only. Builds a signed App Store .ipa for Fit Hard on a cloud Mac,
# mirroring the programme's Android AAB workflow shape (manual dispatch,
# signing material from repo secrets only, Capacitor sync, artifact out).
#
# ⚠ PIPELINE PROOF ONLY — this output proves the compile/sign/export road.
# It is NOT a submission build: Fit Hard submits only on the v30 seal.
# The web bytes compiled here are the certified v29 tree (d503dce5…):
# repo app/ is blob-SHA-identical to the certified www/ (38/38 files),
# and the store packaging rule (no privacy.html in the bundle) is applied
# in the staging step below.
#
# Target home in repo: .github/workflows/ios-ipa.yml (support897/fit-hard)
# Project of record: store-build/ios/App/App.xcodeproj (pushed 16 Oct,
# commits b5554769… + ed20f6a3… — byte-identical to the local project).
# Secrets required (set + confirmed 16 Oct): BUILD_CERTIFICATE_BASE64
# (distribution.p12), P12_PASSWORD, PROVISIONING_PROFILE_BASE64
# ("Fit Hard App Store" profile, UUID 9f1fd971-1fb7-44f8-9b3a-0c788adb6db5).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stage the certified web bundle
        working-directory: store-build
        run: |
          rm -rf www
          mkdir www
          cp -R ../app/. www/
          # Store packaging rule: the certified bundle carries no privacy.html.
          rm -f www/privacy.html
          echo "Staged service worker: $(grep -o 'fitapp-v[0-9]*' www/service-worker.js | head -1)"
          ls www | wc -l

      - name: Install Capacitor and sync iOS
        working-directory: store-build
        run: |
          npm install --no-audit --no-fund
          npx cap sync ios

      - name: Install signing material from secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/distribution.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -d > "$CERT_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/9f1fd971-1fb7-44f8-9b3a-0c788adb6db5.mobileprovision"

      - name: Write ExportOptions
        working-directory: store-build
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>GZ9Z6BPTFR</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ilseplacencia.fithard</key>
              <string>Fit Hard App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Archive (manual signing, distribution identity)
        working-directory: store-build
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/FitHard.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=GZ9Z6BPTFR \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Fit Hard App Store"

      - name: Export IPA
        working-directory: store-build
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FitHard.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: fit-hard-ios-ipa-PIPELINE-PROOF-not-for-submission
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
