name: FitHard
options:
  bundleIdPrefix: com.ilseplacencia
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "28"
    DEVELOPMENT_TEAM: GZ9Z6BPTFR
    TARGETED_DEVICE_FAMILY: "1"
targets:
  FitHard:
    type: application
    platform: iOS
    sources:
      - path: FitHard
        excludes: ["Resources/media/.keep"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilseplacencia.fithard
        PRODUCT_NAME: "Fit Hard"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Fit Hard"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CURRENT_PROJECT_VERSION: "28"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Fit Hard App Store"
  FitHardTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FitHardTests]
    dependencies:
      - target: FitHard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ilseplacencia.fithard.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Fit Hard.app/Fit Hard"
        BUNDLE_LOADER: "$(TEST_HOST)"
  FitHardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FitHardUITests]
    dependencies:
      - target: FitHard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ilseplacencia.fithard.uitests
schemes:
  FitHard:
    build:
      targets:
        FitHard: all
    test:
      targets: [FitHardTests, FitHardUITests]
